[project]
name = "call-me-maybe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic",
    "flake8",
    "mypy",
	"llm-sdk",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
llm-sdk = {path = "llm_sdk"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
exclude = ["llm_sdk"]
